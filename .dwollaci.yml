stages:
  build:
    nodeLabel: sbt-jdk17
    steps:
      - sbt Universal/packageBin
    filesToStash:
      - '**'
  publish:
    nodeLabel: nvm-sbt-jdk17-deployer
    steps:
      - |
        . ${NVM_DIR}/nvm.sh --no-use
        nvm install
        npm install -g npm && npm install -g serverless@3
        sbt "deploy Admin"
  deployDevInt:
    nodeLabel: nvm-sbt-jdk17-deployer
    steps:
      - |
        . ${NVM_DIR}/nvm.sh --no-use
        nvm install
        npm install -g npm && npm install -g serverless@3
        sbt "deploy DevInt"
  deployUat:
    nodeLabel: nvm-sbt-jdk17-deployer
    steps:
      - |
        . ${NVM_DIR}/nvm.sh --no-use
        nvm install
        npm install -g npm && npm install -g serverless@3
        sbt "deploy Uat"
  deployProd:
    nodeLabel: nvm-sbt-jdk17-deployer
    steps:
      - |
        . ${NVM_DIR}/nvm.sh --no-use
        nvm install
        npm install -g npm && npm install -g serverless@3
        sbt "deploy Prod"
